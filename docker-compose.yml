version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: job_user
      POSTGRES_PASSWORD: job_password
      POSTGRES_DB: job_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"


  orchestrator:
    build:
      context: .
      dockerfile: infra/Dockerfile.orchestrator
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://job_user:job_password@postgres:5432/job_platform
      - REDIS_URL=redis://redis:6379/0

  celery_worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://job_user:job_password@postgres:5432/job_platform
      - REDIS_URL=redis://redis:6379/0

volumes:
  postgres_data:
